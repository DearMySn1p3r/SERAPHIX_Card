/* ════════ LOADER ════════ */
.boot{position:fixed;inset:0;z-index:100;overflow:hidden;cursor:pointer;color:var(--ink);
  background:linear-gradient(180deg,#f9fbff 0%,#e8f0fb 55%,#d6e3f5 100%);transition:opacity .8s ease,visibility .8s}
.boot.out{opacity:0;visibility:hidden;pointer-events:none}
.cloud{position:absolute;border-radius:50%;filter:blur(40px);background:#fff;opacity:.9;animation:drift 14s ease-in-out infinite alternate}
.cloud.a{width:46vw;height:22vw;left:-8vw;top:62%}
.cloud.b{width:38vw;height:18vw;right:-6vw;top:70%;animation-duration:18s}
.cloud.c{width:30vw;height:12vw;left:30%;top:8%;opacity:.7;animation-duration:20s}
@keyframes drift{to{transform:translateX(4vw)}}
.towers{position:absolute;inset:auto 0 0 0;height:62vh;display:flex;justify-content:center;align-items:flex-end;gap:clamp(18px,5vw,70px);pointer-events:none}
.towers i{width:1px;background:linear-gradient(180deg,rgba(29,78,216,0),rgba(29,78,216,.22));transform-origin:bottom;transform:scaleY(0);animation:rise-y 1.6s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise-y{to{transform:scaleY(1)}}
.hud{position:absolute;font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--ink3);text-transform:uppercase;display:grid;gap:2px}
.hud b{font-weight:500;color:var(--ink2)}
.hud.tl{top:max(22px,env(safe-area-inset-top,0px));left:max(24px,env(safe-area-inset-left,0px))}
.hud.tr{top:max(22px,env(safe-area-inset-top,0px));right:max(24px,env(safe-area-inset-right,0px));text-align:right}
.hud.bl{bottom:max(22px,env(safe-area-inset-bottom,0px));left:max(24px,env(safe-area-inset-left,0px))}
.hud.br{bottom:max(22px,env(safe-area-inset-bottom,0px));right:max(24px,env(safe-area-inset-right,0px));text-align:right}
@media (max-width:560px){.hud.bl,.hud.br{display:none}}
.core{position:absolute;inset:0;display:grid;place-items:center}
.core-in{display:grid;justify-items:center;gap:16px}
.emb{position:relative;width:260px;height:190px;display:grid;place-items:center}
.emb svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.emb .ring{fill:none;stroke:rgba(29,78,216,.28);stroke-width:1;stroke-dasharray:760;stroke-dashoffset:760;animation:draw 1.6s cubic-bezier(.6,0,.2,1) .2s forwards}
.emb .ring2{fill:none;stroke:rgba(29,78,216,.12);stroke-width:1}
.emb .sat{fill:#1d4ed8;opacity:0;animation:fadein .4s ease 1.4s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadein{to{opacity:1}}
.emb .logo{width:112px;color:#1d4ed8;position:relative;overflow:hidden;clip-path:circle(0% at 50% 50%);
  animation:reveal 1.4s cubic-bezier(.6,0,.2,1) .35s forwards,spinIn 1.8s cubic-bezier(.2,.7,.2,1) .2s both}
.emb .logo i{position:absolute;inset:-10%;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.95) 50%,transparent 58%);transform:translateX(-130%);animation:glint 1.1s ease 1.7s forwards}

@keyframes spinIn{from{transform:rotate(-40deg) scale(.86)}to{transform:none}}
@keyframes glint{to{transform:translateX(130%)}}
.wm{font-family:var(--disp);font-weight:700;font-size:26px;letter-spacing:.5em;padding-left:.5em;line-height:1;opacity:0;animation:up .8s ease .9s forwards}
.wm-sub{font-family:var(--mono);font-size:10px;letter-spacing:.3em;padding-left:.3em;color:var(--ink3);margin-top:-6px;opacity:0;animation:up .8s ease 1.05s forwards}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.prog{width:min(240px,70vw);display:grid;gap:10px;margin-top:12px}
.prog-bar{height:2px;background:rgba(14,23,41,.08);position:relative;overflow:hidden;border-radius:2px}
.prog-bar b{position:absolute;inset:0;background:#1d4ed8;transform-origin:left;transform:scaleX(var(--p,0))}
.prog-meta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--ink3);font-variant-numeric:tabular-nums}
.log{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--ink2);display:grid;gap:3px;min-height:46px}

.log span::after{content:" ................................................................"}

/* ════════ TOP BAR ════════ */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--surface)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:var(--barh);background:rgba(255,255,255,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar-in{height:100%;max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:14px;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:.34em}
.term{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--ink3);padding-left:14px;border-left:1px solid var(--line);white-space:nowrap}
.bar-r{margin-left:auto;display:flex;align-items:center;gap:16px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--ink3);font-variant-numeric:tabular-nums}
.live{display:flex;align-items:center;gap:7px;color:var(--ink2)}
.live::before{content:"";width:6px;height:6px;border-radius:50%;background:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.15)}
@media (max-width:640px){.term,.clock{display:none}.bar-in{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}

/* ════════ APP ════════ */
.app{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:22px;align-items:start;
  padding-block:22px 40px;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px))}
@media (max-width:980px){.app{grid-template-columns:minmax(0,1fr);gap:14px;padding-block:14px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}

/* stage */
.stage{position:sticky;top:calc(var(--barh) + env(safe-area-inset-top,0px) + 22px);height:calc(100vh - var(--barh) - env(safe-area-inset-top,0px) - 44px);min-height:600px;border-radius:22px;border:1px solid var(--line);
  display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;
  background:linear-gradient(180deg,#f7faff 0%,#e9f0fa 60%,#dbe6f5 100%);transition:background .6s}
.stage::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.7;
  background:repeating-linear-gradient(90deg,transparent 0 119px,rgba(29,78,216,.06) 119px 120px);
  -webkit-mask:linear-gradient(180deg,transparent 0%,#000 55%,#000 100%);mask:linear-gradient(180deg,transparent 0%,#000 55%,#000 100%)}
.stage::after{content:"";position:absolute;left:50%;bottom:-30%;width:120%;height:60%;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,255,255,.95),rgba(255,255,255,0));pointer-events:none}
.stage.dark{border-color:#1d1e23;background:linear-gradient(180deg,#141519 0%,#0d0e11 60%,#08090b 100%)}

.stage.dark::after{background:radial-gradient(closest-side,rgba(229,72,77,.12),rgba(229,72,77,0))}
.stage.dark .st-head,.stage.dark .st-foot{color:#80838c}
.stage.dark .seg{background:rgba(255,255,255,.06);border-color:#2a2b31}
.stage.dark .seg button{color:#80838c}
.stage.dark .seg button[aria-pressed="true"]{background:#f3f4f6;color:#0a0a0b}
.stage.dark .chipbtn{background:rgba(255,255,255,.06);border-color:#2a2b31;color:#b9bcc4}
@media (max-width:980px){.stage{position:relative;top:0;height:auto;min-height:0}}
.st-head,.st-foot{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;
  padding:20px 22px 0;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--ink3)}

.chipbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:rgba(255,255,255,.75);border-radius:999px;padding:6px 12px;font:500 11.5px var(--ko);color:var(--ink2);cursor:pointer}

.scene-wrap{position:relative;z-index:1;display:grid;place-items:center;padding:20px 24px}

.tilt{transition:transform .6s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}

.face{grid-area:1/1;position:relative;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:4.8%/3.02%;

  background-size:100% 100%,240% 240%;background-position:center,var(--px,50%) var(--py,50%)}

/* 카드 위 편집칸 */
.inl{position:absolute;z-index:4;margin:0;padding:0 6px;border:1.5px solid var(--ac);border-radius:6px;background:rgba(255,255,255,.97);color:#0b1424;

/* panel */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;min-height:calc(100vh - var(--barh) - env(safe-area-inset-top,0px) - 44px);display:flex;flex-direction:column}

.tabs button{border:0;background:none;padding:16px 4px 14px;cursor:pointer;display:grid;gap:2px;justify-items:center;color:var(--ink3);position:relative;transition:color .2s}
.tabs button small{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em}
.tabs button span{font-family:var(--disp);font-size:12.5px;font-weight:600;letter-spacing:.14em}
.tabs button::after{content:"";position:absolute;left:22%;right:22%;bottom:-1px;height:2px;background:var(--ac);transform:scaleX(0);transition:transform .25s}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs button[aria-selected="true"] small{color:var(--ac)}
.tabs button[aria-selected="true"]::after{transform:scaleX(1)}
.tabs button:focus-visible{outline:2px solid var(--ac);outline-offset:-4px}
.pane{padding:24px 26px 28px;display:grid;gap:22px;align-content:start;flex:1}
.pane[hidden]{display:none}
@media (max-width:420px){.pane{padding:20px 16px 24px}}
.sec{display:grid;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-h h3{margin:0;font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.18em;color:var(--ink3);text-transform:uppercase}

.facs{display:grid;gap:8px}
.fac{position:relative;cursor:pointer}
.fac input{position:absolute;opacity:0;pointer-events:none}
.fac i{display:grid;grid-template-columns:4px 1fr auto;gap:0 14px;align-items:center;font-style:normal;padding:12px 14px 12px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);transition:.18s}
.fac i::before{content:"";grid-row:1/3;align-self:stretch;background:var(--rc);opacity:.25;transition:.18s}
.fac .k{font-size:14px;font-weight:700;display:flex;align-items:baseline;gap:8px}
.fac .k em{font-style:normal;font-family:var(--disp);font-size:11px;font-weight:600;letter-spacing:.22em;color:var(--ink3)}
.fac .d{grid-column:2;font-size:11.5px;color:var(--ink2)}
.fac .tag{grid-row:1/3;grid-column:3;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--ink3);border:1px solid var(--line);border-radius:999px;padding:3px 8px}
.fac:hover i{border-color:#cdd6e3}
.fac input:checked+i{border-color:var(--rc);box-shadow:0 0 0 1px var(--rc) inset}
.fac input:checked+i::before{opacity:1}
.fac input:focus-visible+i{outline:2px solid var(--ac);outline-offset:2px}

.ranks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.rk{position:relative;cursor:pointer;min-width:0}
.rk input{position:absolute;opacity:0;pointer-events:none}
.rk i{display:grid;gap:1px;font-style:normal;padding:9px 10px;border:1px solid var(--line);border-radius:10px;transition:.18s}
.rk .k{font-family:var(--disp);font-size:12px;font-weight:700;letter-spacing:.06em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .e{font-family:var(--mono);font-size:9.5px;color:var(--ink3);display:flex;align-items:center;gap:6px}
.rk .e::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--rc)}
.rk:hover i{border-color:#cdd6e3}
.rk input:checked+i{border-color:var(--ink);background:var(--soft)}
.rk input:focus-visible+i{outline:2px solid var(--ac);outline-offset:2px}

.swatches{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.sw{width:24px;height:24px;border-radius:50%;border:0;cursor:pointer;padding:0;position:relative}
.sw.on::after{content:"";position:absolute;inset:-4px;border:1.5px solid var(--sc);border-radius:50%}
.sw:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
input[type=color]{width:28px;height:28px;padding:0;border:1px solid var(--line);border-radius:50%;background:none;cursor:pointer;overflow:hidden}
input[type=color]::-webkit-color-swatch-wrapper{padding:2px}input[type=color]::-webkit-color-swatch{border:0;border-radius:50%}
.link{border:0;background:none;color:var(--ink3);font-size:11.5px;cursor:pointer;padding:4px 2px;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--ac)}

.gr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px}
@media (max-width:420px){.gr{grid-template-columns:minmax(0,1fr)}}
.f{display:grid;gap:6px;min-width:0;position:relative}
.f.wide{grid-column:1/-1}

input[type=text],input[type=date],select{width:100%;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--soft);font-size:13px;font-weight:500;transition:border-color .16s,box-shadow .16s,background .16s}
input[type=text]{font-family:var(--disp);letter-spacing:.02em}
input:hover,select:hover{border-color:#cdd6e3;background:#fff}
input:focus,select:focus{outline:none;border-color:var(--ac);background:#fff;box-shadow:0 0 0 3px var(--ac-10)}
select{appearance:none;padding-right:32px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);
  background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font:500 10px var(--mono);letter-spacing:.06em;color:var(--ink2);cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--ac);color:var(--ac)}
.chip.on{border-color:var(--ac);color:var(--ac);background:var(--ac-05)}
.chip:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.idf input{padding-right:42px;font-family:var(--mono);letter-spacing:.06em}
.idf .ico{position:absolute;right:5px;bottom:5px;width:30px;height:30px;border:0;border-radius:8px;background:transparent;cursor:pointer;color:var(--ink3);display:grid;place-items:center}

.drop{display:grid;place-items:center;gap:6px;border:1px dashed #c6d0de;border-radius:14px;background:var(--soft);padding:30px 16px;text-align:center;cursor:pointer;transition:.16s}
.drop:hover,.drop.over{border-color:var(--ac);background:var(--ac-05)}
.drop .pic{width:42px;height:56px;border:1px solid #c6d0de;border-radius:4px;display:grid;place-items:end center;overflow:hidden;background:#fff}
.drop .pic{position:relative}
.drop .pic::after{content:"";position:absolute;left:50%;top:13px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#dfe5ee}
.drop .pic::before{content:"";width:26px;height:17px;border-radius:13px 13px 0 0;background:#dfe5ee}
.drop b{font-size:13px;font-weight:700}

.rr{display:flex;align-items:center;gap:12px}

input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--ac) var(--fill,0%),var(--line) var(--fill,0%));cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:1.5px solid var(--ac);box-shadow:0 1px 3px rgba(0,0,0,.12)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:1.5px solid var(--ac)}
.val{font-family:var(--mono);font-size:10.5px;color:var(--ink3);min-width:40px;text-align:right;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:12.5px;font-weight:700;cursor:pointer;transition:.16s}
.btn:hover{border-color:#cdd6e3;background:var(--soft)}

<body>

</div>

/* ══════════ 탭 ══════════ */
const tabs=[...document.querySelectorAll('.tabs button')],panes=[...document.querySelectorAll('.pane')];
function showTab(i){
  S.tab=i;tabs.forEach((t,k)=>t.setAttribute('aria-selected',k===i));panes.forEach((p,k)=>p.hidden=k!==i);
  $('prev').style.visibility=i===0?'hidden':'visible';
  $('next').textContent=i===3?'앞면 저장':'다음';
  if(i===2&&S.side!=='F')showSide('F');
  persist();
}
tabs.forEach((t,i)=>t.onclick=()=>showTab(i));
$('prev').onclick=()=>showTab(Math.max(0,S.tab-1));
$('next').onclick=()=>{if(S.tab===3)save('F');else{showTab(S.tab+1);if(window.innerWidth>980)document.querySelector('.panel').scrollTo?.(0,0);}};

/* ══════════ 앞/뒤 · 홀로그램 ══════════ */
function showSide(s){
  S.side=s;$('flip').classList.toggle('b',s==='B');
  $('sideF').setAttribute('aria-pressed',s==='F');$('sideB').setAttribute('aria-pressed',s==='B');
  
}
$('sideF').onclick=()=>showSide('F');$('sideB').onclick=()=>showSide('B');
const viewer=$('viewer'),tilt=$('tilt');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function resetTilt(){tilt.classList.remove('live');tilt.style.transform='';}
viewer.addEventListener('pointermove',e=>{
  if(!S.holo||drag||editing||reduce||e.pointerType==='touch')return;
  const r=tilt.getBoundingClientRect();
  const nx=Math.max(-1,Math.min(1,((e.clientX-r.left)/r.width-.5)*2)),ny=Math.max(-1,Math.min(1,((e.clientY-r.top)/r.height-.5)*2));
  tilt.classList.add('live');tilt.style.transform=`rotateX(${(-ny*6).toFixed(2)}deg) rotateY(${(nx*8).toFixed(2)}deg)`;
  viewer.style.setProperty('--mx',(50+nx*45)+'%');viewer.style.setProperty('--my',(50+ny*45)+'%');
  viewer.style.setProperty('--px',(50+nx*50)+'%');viewer.style.setProperty('--py',(50+ny*50)+'%');
});
viewer.addEventListener('pointerleave',resetTilt);

/* ══════════ 저장 ══════════ */
const safe=s=>((s||'ID').replace(/[^\w가-힣.-]+/g,'_').replace(/^_+|_+$/g,'')||'ID');
function makeCanvas(side,bleed,k){
  const c=document.createElement('canvas');
  c.width=Math.round((bleed?W+2*B:W)*k);c.height=Math.round((bleed?H+2*B:H)*k);
  const x=c.getContext('2d');x.imageSmoothingQuality='high';render(x,k,bleed,side);return c;
}
function save(kind){
  sync();
  const dpi=+$('dpi').value,k=dpi/25.4,bleed=$('bleed').checked;
  let c;
  if(kind==='all'){const a=makeCanvas('F',bleed,k),b=makeCanvas('B',bleed,k),gap=Math.round(4*k);
    c=document.createElement('canvas');c.width=a.width*2+gap;c.height=a.height;const x=c.getContext('2d');x.drawImage(a,0,0);x.drawImage(b,a.width+gap,0);}
  else c=makeCanvas(kind,bleed,k);
  c.toBlob(bl=>{
    if(!bl)return;const a=document.createElement('a');a.href=URL.createObjectURL(bl);
    a.download=F().en+'_ID_'+safe(S.codeName)+'_'+({F:'FRONT',B:'BACK',all:'BOTH'}[kind])+(bleed?'_PRINT':'')+'_'+dpi+'dpi.png';
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  },'image/png');
}
$('saveF').onclick=()=>save('F');$('saveB').onclick=()=>save('B');$('saveAll').onclick=()=>save('all');
function spec(){const k=(+$('dpi').value)/25.4,b=$('bleed').checked,w=b?58:54,h=b?90:86;
  $('sp1').textContent=(b?'WORK ':'TRIM ')+w+' × '+h+' MM';$('sp2').textContent=Math.round(w*k)+' × '+Math.round(h*k)+' PX';}
$('dpi').onchange=spec;$('bleed').onchange=spec;
$('wipe').onclick=()=>{try{localStorage.removeItem(KEY);}catch(e){}location.reload();};

/* ══════════ 시계 ══════════ */
function clockTxt(){const d=new Date();return 'NST '+[d.getHours(),d.getMinutes(),d.getSeconds()].map(n=>String(n).padStart(2,'0')).join(':');}
function tick(){$('clock').textContent=clockTxt();const bc=$('bootClock');if(bc)bc.textContent=clockTxt();}
tick();setInterval(tick,1000);

/* ══════════ 시작 ══════════ */
if(!restored||!S.idNo)newId();
if(!S.custom)S.accent=F().c;pick.value=S.accent;markSwatch();spec();facUI();
setSwitch($('mono'),S.mono);S.holo=false;
showTab(S.tab>=0&&S.tab<4?S.tab:0);
window.addEventListener('resize',sizePv);sizePv();
const fontsReady=document.fonts?Promise.all([
  document.fonts.load('700 12px "Chakra Petch"'),document.fonts.load('600 12px "Chakra Petch"'),document.fonts.load('italic 500 12px "Chakra Petch"'),
  document.fonts.load('500 12px Pretendard'),document.fonts.load('400 12px Pretendard'),document.fonts.load('500 12px "JetBrains Mono"')
]).catch(()=>{}).then(()=>document.fonts.ready):Promise.resolve();
fontsReady.then(draw);

/* ══════════ 로딩 ══════════ */
const boot=$('boot'),DUR=reduce?300:2600,t0=performance.now();let bootDone=false,minDone=false,fontsDone=false;
function bootFrame(t){
  if(bootDone)return;
  const p=Math.min(1,(t-t0)/DUR),e=1-Math.pow(1-p,2.2);
  $('pBar').style.setProperty('--p',e);$('pPct').textContent=String(Math.round(e*100)).padStart(3,'0')+'%';
  if(e>.9)$('pTxt').textContent='ACCESS GRANTED';
  if(p<1)requestAnimationFrame(bootFrame);else{minDone=true;tryClose();}
}
requestAnimationFrame(bootFrame);
fontsReady.then(()=>{fontsDone=true;tryClose();});
function tryClose(){if(minDone&&fontsDone)closeBoot();}
function closeBoot(){if(bootDone)return;bootDone=true;$('pBar').style.setProperty('--p',1);$('pPct').textContent='100%';$('pTxt').textContent='ACCESS GRANTED';setTimeout(()=>boot.classList.add('out'),reduce?0:400);}
boot.onclick=closeBoot;
setTimeout(closeBoot,6000);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SERAPHIX · ID CARD MAKER</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --ac:#1d4ed8; --ac-d:#1439a0; --ac-05:rgba(29,78,216,.05); --ac-10:rgba(29,78,216,.10);
  --bg:#f5f6f8; --card:#fff; --ink:#101623; --ink2:#525b6b; --ink3:#9aa2b1;
  --line:#e7e9ee; --line2:#f2f3f6;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:Pretendard,"Pretendard Variable",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}

.top{position:sticky;top:0;z-index:30;background:rgba(245,246,248,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:10px}
.mark{width:7px;height:7px;background:var(--ac);transition:background .25s}
.title{font-weight:800;font-size:13px;letter-spacing:.24em}
.sub{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--ink3);margin-left:auto}
@media (max-width:560px){.sub{display:none}}

.wrap{max-width:1120px;margin:0 auto;padding:24px 24px 90px;display:grid;grid-template-columns:372px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.wrap{grid-template-columns:1fr;padding:16px 16px 70px;gap:16px}.stage{position:static !important}}
.card{background:var(--card);border-radius:10px;box-shadow:0 1px 2px rgba(16,22,35,.04),0 8px 28px rgba(16,22,35,.05)}
.blk{padding:22px 24px;border-bottom:1px solid var(--line2)}
.blk:last-child{border-bottom:0}
.blk-t{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 14px;font-size:10.5px;font-weight:700;letter-spacing:.16em;color:var(--ink3);text-transform:uppercase;font-family:var(--mono)}
.blk-t small{font-family:var(--sans);letter-spacing:0;text-transform:none;font-weight:500;font-size:10.5px;color:var(--ink3)}

.pick{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.pk{position:relative;cursor:pointer}
.pk input{position:absolute;opacity:0;pointer-events:none}
.pk i{display:block;font-style:normal;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;transition:.18s}
.pk .c{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--ink3);margin-bottom:3px}
.pk .k{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.pk .k::before{content:"";width:5px;height:5px;background:var(--rc);flex:0 0 auto}
.pk .e{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;color:var(--ink3);margin-top:2px}
.pk:hover i{border-color:#d3d8e0}
.pk input:checked+i{border-color:var(--rc);box-shadow:inset 0 0 0 1px var(--rc)}
.pk input:focus-visible+i{outline:2px solid var(--ac);outline-offset:2px}

.gr{display:grid;grid-template-columns:1fr 1fr;gap:11px}
@media (max-width:420px){.gr{grid-template-columns:1fr}}
.f{display:block;min-width:0;position:relative}
.f>span,.f>label{display:block;margin-bottom:5px;font-size:10.5px;font-weight:600;color:var(--ink2)}
.f.wide{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:5px;padding:4px 8px;font:600 9.5px var(--mono);letter-spacing:.04em;color:var(--ink3);cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--ac);color:var(--ac)}
.chip.on{border-color:var(--ac);color:var(--ac);background:var(--ac-05)}
input[type=text]{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:#fbfbfc;color:var(--ink);font:500 12.5px/1.4 var(--sans);transition:.18s}
input[type=text]:hover{border-color:#d3d8e0;background:#fff}
input[type=text]:focus{outline:none;border-color:var(--ac);background:#fff;box-shadow:0 0 0 3px var(--ac-10)}
select{width:100%;padding:8px 28px 8px 11px;border:1px solid var(--line);border-radius:7px;background:#fbfbfc;color:var(--ink);font:500 12px var(--sans);appearance:none;cursor:pointer;transition:.18s;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);
  background-position:calc(100% - 14px) 50%,calc(100% - 9px) 50%;background-size:5px 5px;background-repeat:no-repeat}
select:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-10)}

.idf input{padding-right:38px;font-family:var(--mono);letter-spacing:.04em}
.idf{position:relative}
.idf .ico{position:absolute;right:5px;bottom:5px;width:28px;height:28px;border:0;border-radius:6px;background:transparent;cursor:pointer;color:var(--ink3);display:grid;place-items:center;transition:.15s}
.idf .ico:hover{background:var(--ac-10);color:var(--ac)}
.idf .ico svg{width:14px;height:14px}

.swatches{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sw{width:22px;height:22px;border-radius:5px;border:1px solid rgba(0,0,0,.08);cursor:pointer;padding:0;transition:.15s;position:relative}
.sw:hover{transform:translateY(-1px)}
.sw.on::after{content:"";position:absolute;inset:-4px;border:1.5px solid var(--sc);border-radius:8px}
input[type=color]{width:28px;height:22px;padding:0;border:1px solid var(--line);border-radius:5px;background:none;cursor:pointer}
.sw-reset{border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink2);font:600 10.5px var(--sans);padding:5px 9px;cursor:pointer;transition:.15s}
.sw-reset:hover{border-color:#d3d8e0}

.drop{border:1px dashed #ccd2dc;border-radius:8px;background:#fbfbfc;padding:20px 14px;text-align:center;cursor:pointer;transition:.18s}
.drop:hover,.drop.over{border-color:var(--ac);background:var(--ac-05)}
.drop b{display:block;font-size:12px;font-weight:700}
.drop small{display:block;margin-top:3px;font-family:var(--mono);font-size:9.5px;color:var(--ink3)}
.rr{display:flex;align-items:center;gap:11px;margin-top:14px}
.rr>span:first-child{font-size:10.5px;font-weight:600;color:var(--ink2)}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--ac) var(--fill,0%),var(--line) var(--fill,0%));cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;border:1.5px solid var(--ac);box-shadow:0 1px 3px rgba(0,0,0,.14)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:1.5px solid var(--ac)}
.val{font-family:var(--mono);font-size:10px;color:var(--ink3);min-width:36px;text-align:right}
.mini{display:flex;gap:7px;margin-top:12px}
.mini .btn{flex:1}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font:700 12px var(--sans);cursor:pointer;transition:.18s}
.btn:hover{border-color:#d3d8e0;background:#fbfbfc}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.p:hover{background:var(--ac-d);border-color:var(--ac-d)}
.btn.s{padding:8px;font-size:11px;font-weight:600;color:var(--ink2)}
.btn em{font-style:normal;font-family:var(--mono);font-size:9px;font-weight:500;opacity:.65;letter-spacing:.05em}

.stage{position:sticky;top:74px}
.stage-in{padding:24px}
.hold{display:flex;justify-content:center;padding:26px 24px;border-radius:8px;background:#eef0f4}
#pv{display:block;width:100%;max-width:280px;height:auto;touch-action:none;cursor:grab;
  filter:drop-shadow(0 14px 22px rgba(16,22,35,.15)) drop-shadow(0 2px 5px rgba(16,22,35,.09))}
#pv.on{cursor:grabbing}
.hint{margin:15px 0 0;text-align:center;font-size:10.5px;color:var(--ink3);line-height:1.7}
kbd{font-family:var(--mono);font-size:9px;background:#fff;border:1px solid var(--line);border-radius:3px;padding:1.5px 4px;color:var(--ink2)}
.saves{display:grid;gap:8px;margin-top:20px}
.dpi{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line2)}
.dpi>span{font-size:10.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.spec{margin-top:11px;display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;letter-spacing:.05em;color:var(--ink3)}
.foot{max-width:1120px;margin:0 auto;padding:0 24px 40px;font-family:var(--mono);font-size:9.5px;color:var(--ink3);text-align:center}
</style>
</head>
<body>

<div class="top"><div class="top-in">
  <span class="mark"></span><span class="title">SERAPHIX</span>
  <span class="sub">ID CARD MAKER · 54×86</span>
</div></div>

<div class="wrap">
  <div class="card">
    <div class="blk">
      <h2 class="blk-t">Faction <small>레이아웃이 다릅니다</small></h2>
      <div class="pick" id="facs"></div>
    </div>
    <div class="blk">
      <h2 class="blk-t">Rank <small>전 진영 공통</small></h2>
      <div class="pick" id="ranks"></div>
    </div>
    <div class="blk">
      <h2 class="blk-t">Profile</h2>
      <div class="gr">
        <label class="f"><span>코드네임</span><input type="text" id="codeName" maxlength="16" placeholder="CODENAME"></label>
        <label class="f"><span>이름 (선택)</span><input type="text" id="nameKo" maxlength="14" placeholder="한글 표기"></label>
        <label class="f"><span>성별 / 나이</span><input type="text" id="sexAge" placeholder="F / 00"></label>
        <label class="f"><span>국적</span><input type="text" id="country" placeholder="COUNTRY"></label>
        <div class="f wide"><label for="ability">특성 / 이능력</label>
          <input type="text" id="ability" placeholder="ABILITY" autocomplete="off">
          <div class="chips" id="abilChips"></div>
        </div>
        <div class="f idf wide"><label for="idNo">ID NO.</label>
          <input type="text" id="idNo" placeholder="SX-0000-AA" autocomplete="off">
          <button class="ico" id="reroll" type="button" title="랜덤 재발급" aria-label="ID 랜덤 재발급">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
          </button>
        </div>
      </div>
    </div>
    <div class="blk">
      <h2 class="blk-t">Photo</h2>
      <div class="drop" id="drop"><b>이미지 업로드</b><small>클릭 · 드래그 앤 드롭 · 붙여넣기</small></div>
      <input type="file" id="file" accept="image/*" hidden>
      <div class="rr"><span>확대</span><input type="range" id="zoom" min="1" max="5" step="0.01" value="1"><span class="val" id="zoomV">100%</span></div>
      <div class="mini">
        <button class="btn s" id="fit" type="button">위치 초기화</button>
        <button class="btn s" id="clr" type="button">사진 제거</button>
      </div>
    </div>
    <div class="blk">
      <h2 class="blk-t">Accent</h2>
      <div class="swatches" id="swatches"></div>
    </div>
  </div>

  <div class="stage">
    <div class="card stage-in">
      <div class="hold"><canvas id="pv" aria-label="사원증 미리보기"></canvas></div>
      <p class="hint">사진을 <kbd>드래그</kbd>하여 이동 · <kbd>휠</kbd>로 확대 축소</p>
      <div class="saves">
        <button class="btn p" id="saveA" type="button">웹용 이미지 저장 <em>54×86mm</em></button>
        <button class="btn" id="saveB" type="button">인쇄용 여백 포함 저장 <em>58×90mm</em></button>
      </div>
      <div class="dpi">
        <span>해상도</span>
        <select id="dpi">
          <option value="300" selected>300 DPI (권장)</option>
          <option value="600">600 DPI (고해상도)</option>
          <option value="150">150 DPI (저해상도)</option>
        </select>
      </div>
      <div class="spec"><span id="sp1"></span><span id="sp2"></span></div>
    </div>
  </div>
</div>

<div class="foot">모든 데이터 처리는 브라우저 내부에서만 안전하게 이루어집니다.</div>

<script>
"use strict";
/* ══════════════════════════════════════════════════════════
   좌표: mm · 원점: 재단선 좌상단 · 화이트 고정 · 영문 표기
   ══════════════════════════════════════════════════════════ */
const CARD={w:54,h:86}, BLEED=2, RAD=2.6;
const SANS='Pretendard,"Pretendard Variable",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif';
const MONO='ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace';

const RANKS=[
  {code:'PX-00',en:'EXECUTOR',   c:'#5b21b6'},
  {code:'PX-01',en:'ENFORCER',   c:'#1d4ed8'},
  {code:'PX-02',en:'RANGER',     c:'#0284c7'},
  {code:'PX-03',en:'RUNNER',     c:'#0d9488'},
  {code:'PX-04',en:'ROOKIE',     c:'#059669'},
  {code:'VX-01',en:'STABILIZER', c:'#b91c1c'}
];
const SWATCH=['#1d4ed8','#5b21b6','#0284c7','#0d9488','#b91c1c','#1f2937'];

const LIGHT={ink:'#101623',inkM:'#525b6b',inkL:'#9aa2b1',line:'#e7e9ee',ph:'#f1f2f5',phInk:'#c6cbd5'};
const DARKP={ink:'#f5f6f8',inkM:'#9aa1ad',inkL:'#6e7480',line:'#26262b',ph:'#141416',phInk:'#3a3a41'};
const P=Object.assign({},LIGHT);

const S={
  fac:0, rank:1, accent:'#1d4ed8', custom:false,
  codeName:'CODENAME', nameKo:'', sexAge:'F / 00', country:'NOCTHRA', ability:'ELEMENTAL',
  idNo:'', seed:1, img:null, zoom:1, px:0, py:0
};

const $=id=>document.getElementById(id);
const cv=$('pv'), cx=cv.getContext('2d');

function mix(hex,to,k){
  const h=hex.replace('#',''),n=parseInt(h.length===3?h.split('').map(c=>c+c).join(''):h,16);
  const m=(a,b)=>Math.round(a+(b-a)*k);
  return `rgb(${m((n>>16)&255,to[0])},${m((n>>8)&255,to[1])},${m(n&255,to[2])})`;
}
const rgba=(hex,a)=>{const h=hex.replace('#',''),n=parseInt(h.length===3?h.split('').map(c=>c+c).join(''):h,16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;};

function mt(c,s,sp){let w=0;for(const ch of [...s])w+=c.measureText(ch).width;return w+sp*Math.max(0,[...s].length-1);}
function T(c,txt,x,y,o){
  if(txt===undefined||txt===null||txt==='')return 0;
  const {size=3,weight=400,color='#000',sp=0,align='left',max=0,font=SANS,stroke=0}=o||{};
  const set=s=>c.font=`${weight} ${s}px ${font}`;
  set(size);
  let s=size,p=sp,w=mt(c,txt,sp);
  if(max&&w>max){const k=max/w;s=size*k;p=sp*k;set(s);w=mt(c,txt,p);}
  c.textAlign='left';c.textBaseline='alphabetic';
  let sx=align==='right'?x-w:align==='center'?x-w/2:x;
  if(stroke){c.strokeStyle=color;c.lineWidth=stroke;c.lineJoin='round';}
  else c.fillStyle=color;
  for(const ch of [...txt]){ stroke?c.strokeText(ch,sx,y):c.fillText(ch,sx,y); sx+=c.measureText(ch).width+p; }
  return w;
}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function rnd(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
function line(c,x1,y,x2,col,h){c.fillStyle=col;c.fillRect(x1,y,x2-x1,h||.16);}
function bars(c,x1,x2,y,h,col,seed){
  const R=rnd(seed);c.fillStyle=col;let x=x2;
  while(x>x1){const bw=.15+R()*.42,gp=.18+R()*.32;x-=bw;if(x<x1)break;c.fillRect(x,y,bw,h);x-=gp;}
}
/* 공통 라벨 (모노 · 언더스코어 스타일) */
function lab(c,txt,x,y,o){return T(c,txt,x,y,Object.assign({size:1.35,weight:600,color:P.inkL,sp:.5,font:MONO},o||{}));}

/* ══════════ 진영 ══════════ */
const FACS=[
{ id:'seraphix', ko:'세라픽스', en:'SERAPHIX', tag:'HERO MANAGEMENT', note:'중앙 관리', c:'#1d4ed8', pre:'SX',
  photo:{x:17,y:17.8,w:20,h:26.6}, draw:drawSeraphix },
{ id:'ideologia', ko:'이데올로기아', en:'IDEOLOGIA', tag:'INDEPENDENT UNION', note:'독립 연합', c:'#0d9488', pre:'ID',
  photo:{x:6.4,y:19.4,w:17.5,h:23.3}, draw:drawIdeologia },
{ id:'exitus', ko:'엑시투스', en:'EXITUS', tag:'UNREGISTERED', note:'비공개', c:'#e5484d', pre:'EX',
  bg:'#0a0a0b', dark:1, photo:{x:6,y:20.6,w:19,h:25.3}, draw:drawExitus },
{ id:'nocthra', ko:'녹트라', en:'NOCTHRA', tag:'NATIONAL REGISTRY', note:'국가 발급', c:'#1e3a8a', pre:'NC',
  photo:{x:6,y:19.4,w:18.5,h:24.7}, draw:drawNocthra }
];
const F=()=>FACS[S.fac];
const PH=()=>F().photo;
const AC=()=>F().dark?mix(S.accent,[255,255,255],.14):S.accent;

const cover=()=>{const p=PH();return S.img?Math.max(p.w/S.img.naturalWidth,p.h/S.img.naturalHeight):1;};
const dsize=()=>{const s=cover()*S.zoom;return{w:S.img.naturalWidth*s,h:S.img.naturalHeight*s};};
function clampP(){if(!S.img)return;const p=PH(),d=dsize();
  S.px=Math.min(0,Math.max(p.w-d.w,S.px));S.py=Math.min(0,Math.max(p.h-d.h,S.py));}
function centerP(){if(!S.img)return;const p=PH(),d=dsize();S.px=(p.w-d.w)/2;S.py=(p.h-d.h)/2;clampP();}

function photo(c,radius){
  const p=PH();
  c.save();
  if(radius)rr(c,p.x,p.y,p.w,p.h,radius);else{c.beginPath();c.rect(p.x,p.y,p.w,p.h);}
  c.clip();
  let ok=false;
  if(S.img&&S.img.naturalWidth>0){
    try{const d=dsize();c.drawImage(S.img,p.x+S.px,p.y+S.py,d.w,d.h);ok=true;}catch(err){ok=false;}
  }
  if(!ok){
    c.fillStyle=P.ph;c.fillRect(p.x,p.y,p.w,p.h);
    c.strokeStyle=P.phInk;c.lineWidth=.3;
    const cxp=p.x+p.w/2,cyp=p.y+p.h*.44;
    c.beginPath();c.arc(cxp,cyp-1.0,2.0,0,Math.PI*2);c.stroke();
    c.beginPath();c.arc(cxp,cyp+5.4,3.9,Math.PI,0);c.stroke();
  }
  c.restore();
}

/* ══════════════════════════════════════════
   ① SERAPHIX — 센터 공식 배지
   ══════════════════════════════════════════ */
function drawSeraphix(c){
  const A=AC(),R=RANKS[S.rank];
  line(c,-BLEED,0,CARD.w+BLEED,A,1.0);
  T(c,F().en,27,10.6,{size:3.5,weight:800,color:P.ink,sp:1.1,align:'center',max:42});
  lab(c,F().tag,27,13.6,{align:'center',sp:.7,max:42});

  photo(c,1.2);
  const p=PH();
  c.strokeStyle=P.line;c.lineWidth=.18;rr(c,p.x,p.y,p.w,p.h,1.2);c.stroke();
  c.strokeStyle=A;c.lineWidth=.4;const q=2.4;

/* ══════════ 렌더 ══════════ */
function render(c,k,bleed){
  const b=bleed?BLEED:0,f=F();
  c.setTransform(1,0,0,1,0,0);
  c.clearRect(0,0,c.canvas.width,c.canvas.height);
  c.translate(b*k,b*k);c.scale(k,k);
  Object.assign(P,f.dark?DARKP:LIGHT);
  c.save();
  if(bleed){c.beginPath();c.rect(-BLEED,-BLEED,CARD.w+BLEED*2,CARD.h+BLEED*2);}
  else rr(c,0,0,CARD.w,CARD.h,RAD);
  c.clip();
  c.fillStyle=f.bg||'#ffffff';c.fillRect(-BLEED,-BLEED,CARD.w+BLEED*2,CARD.h+BLEED*2);
  try{f.draw(c);}catch(err){console.error('render',err);}
  if(!bleed){rr(c,.1,.1,CARD.w-.2,CARD.h-.2,RAD-.1);c.lineWidth=.18;c.strokeStyle=P.line;c.stroke();}
  c.restore();
  c.setTransform(1,0,0,1,0,0);
}

/* ══════════ 미리보기 ══════════ */
let PK=6;
function sizePv(){
  const w=cv.clientWidth||280,dpr=Math.min(window.devicePixelRatio||1,2);
  PK=(w/CARD.w)*dpr*1.5;
  cv.width=Math.round(CARD.w*PK);cv.height=Math.round(CARD.h*PK);
  cv.style.height=(w*CARD.h/CARD.w)+'px';draw();
}
const FIELDS=['codeName','nameKo','sexAge','country','ability','idNo'];
function sync(){FIELDS.forEach(id=>{const el=$(id);if(el)S[id]=el.value;});}
const draw=()=>{sync();render(cx,PK,false);};
const mmPer=()=>CARD.w/(cv.clientWidth||280);

/* ══════════ 사진 조작 ══════════ */
const pts=new Map();let drag=false,last=null,pinch=null;
function hit(e){
  const r=cv.getBoundingClientRect(),mm=CARD.w/r.width,p=PH();
  const x=(e.clientX-r.left)*mm,y=(e.clientY-r.top)*mm;
  return x>=p.x-1&&x<=p.x+p.w+1&&y>=p.y-1&&y<=p.y+p.h+1;
}
cv.addEventListener('pointerdown',e=>{
  if(!S.img)return;if(pts.size===0&&!hit(e))return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1){drag=true;last={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId);cv.classList.add('on');}
  else if(pts.size===2){const[a,b]=[...pts.values()];drag=false;pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,z:S.zoom};}
});
cv.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&pts.size===2){const[a,b]=[...pts.values()];setZoom(pinch.z*(Math.hypot(a.x-b.x,a.y-b.y)/pinch.d),null);return;}
  if(!drag)return;
  const mm=mmPer();S.px+=(e.clientX-last.x)*mm;S.py+=(e.clientY-last.y)*mm;
  last={x:e.clientX,y:e.clientY};clampP();draw();
});
function up(e){pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(!pts.size){drag=false;cv.classList.remove('on');}}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{
  if(!S.img||!hit(e))return;e.preventDefault();
  const r=cv.getBoundingClientRect(),mm=CARD.w/r.width,p=PH();
  setZoom(S.zoom*(e.deltaY<0?1.09:1/1.09),[(e.clientX-r.left)*mm-p.x,(e.clientY-r.top)*mm-p.y]);
},{passive:false});
function setZoom(z,anchor){
  if(!S.img)return;
  const p=PH(),nz=Math.min(5,Math.max(1,z)),a=anchor||[p.w/2,p.h/2],before=dsize();
  const rx=(a[0]-S.px)/before.w,ry=(a[1]-S.py)/before.h;
  S.zoom=nz;const after=dsize();
  S.px=a[0]-rx*after.w;S.py=a[1]-ry*after.h;clampP();
  $('zoom').value=S.zoom;fill($('zoom'));$('zoomV').textContent=Math.round(S.zoom*100)+'%';draw();
}

/* ══════════ 이미지 입력 ══════════ */
let objURL=null;
function load(f){
  if(!f||!/^image\//.test(f.type||''))return;
  const url=URL.createObjectURL(f);
  const im=new Image();
  im.onload=async()=>{
    try{ if(im.decode) await im.decode(); }catch(e){}
    if(!im.naturalWidth){URL.revokeObjectURL(url);return;}
    if(objURL)URL.revokeObjectURL(objURL);
    objURL=url;
    S.img=im;S.zoom=1;$('zoom').value=1;fill($('zoom'));$('zoomV').textContent='100%';
    centerP();draw();
  };
  im.onerror=()=>URL.revokeObjectURL(url);
  im.src=url;
}
$('drop').onclick=()=>$('file').click();
$('file').onchange=e=>{const f=e.target.files&&e.target.files[0];load(f);e.target.value='';};
['dragenter','dragover'].forEach(x=>$('drop').addEventListener(x,()=>$('drop').classList.add('over')));
['dragleave','dragend'].forEach(x=>$('drop').addEventListener(x,()=>$('drop').classList.remove('over')));
/* 창 어디에 떨어뜨려도 페이지가 이미지로 이동하지 않도록 전역에서 차단 후 업로드 처리 */
window.addEventListener('dragover',e=>{e.preventDefault();},false);
window.addEventListener('drop',e=>{
  e.preventDefault();$('drop').classList.remove('over');
  const dt=e.dataTransfer;if(dt&&dt.files&&dt.files[0])load(dt.files[0]);
},false);
window.addEventListener('paste',e=>{
  const items=e.clipboardData&&e.clipboardData.items;if(!items)return;
  for(const i of items)if(i.type&&i.type.startsWith('image/')){const f=i.getAsFile();if(f){load(f);break;}}
});
$('fit').onclick=()=>{S.zoom=1;$('zoom').value=1;fill($('zoom'));$('zoomV').textContent='100%';centerP();draw();};
$('clr').onclick=()=>{S.img=null;S.zoom=1;$('zoom').value=1;fill($('zoom'));$('zoomV').textContent='100%';draw();};

/* ══════════ 진영 · 랭크 ══════════ */

const swBox=$('swatches');
SWATCH.forEach(col=>{

function markSwatch(){[...swBox.querySelectorAll('.sw')].forEach(b=>b.classList.toggle('on',S.custom&&b.dataset.col.toLowerCase()===S.accent.toLowerCase()));}

/* ══════════ 폼 ══════════ */
FIELDS.forEach(id=>{
  const el=$(id);el.value=S[id];

/* 특성 프리셋 */
const ABILS=['ENHANCEMENT','ELEMENTAL','PSYCHIC','CONCEPTUAL','MUTATION','ETC'];
const chipBox=$('abilChips');
ABILS.forEach(v=>{
  const b=document.createElement('button');

  chipBox.appendChild(b);

function markChips(){
  const cur=($('ability').value||'').trim().toUpperCase();

$('zoom').oninput=e=>setZoom(+e.target.value,null);
function fill(el){el.style.setProperty('--fill',(el.value-el.min)/(el.max-el.min)*100+'%');}
fill($('zoom'));

function newId(){
  const D='0123456789',A='ABCDEFGHJKLMNPQRSTUVWXYZ';
  const r=(s,n)=>Array.from({length:n},()=>s[Math.floor(Math.random()*s.length)]).join('');
  S.idNo=F().pre+'-'+r(D,4)+'-'+r(A,2);
  S.seed=(Math.random()*4294967295)>>>0;$('idNo').value=S.idNo;
}
$('reroll').onclick=()=>{S.idCustom=false;newId();draw();};

/* ══════════ 저장 ══════════ */
const safe=s=>((s||'ID').replace(/[^\w가-힣.-]+/g,'_').replace(/^_+|_+$/g,'')||'ID');
function save(bleed){
  const dpi=+$('dpi').value,k=dpi/25.4,c=document.createElement('canvas');
  c.width=Math.round((bleed?CARD.w+2*BLEED:CARD.w)*k);
  c.height=Math.round((bleed?CARD.h+2*BLEED:CARD.h)*k);
  sync();
  const x=c.getContext('2d');x.imageSmoothingQuality='high';render(x,k,bleed);
  c.toBlob(bl=>{
    const a=document.createElement('a');a.href=URL.createObjectURL(bl);
    a.download=F().en+'_ID_'+safe(S.codeName)+'_'+(bleed?'PRINT_58x90':'54x86')+'_'+dpi+'dpi.png';
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  },'image/png');
}
$('saveA').onclick=()=>save(false);$('saveB').onclick=()=>save(true);
$('dpi').onchange=()=>{
  const k=(+$('dpi').value)/25.4;
  $('sp1').textContent='TRIM '+Math.round(54*k)+' × '+Math.round(86*k)+' px';
  $('sp2').textContent='WORK '+Math.round(58*k)+' × '+Math.round(90*k)+' px';
};

newId();accentCSS();markSwatch();markChips();$('dpi').onchange();
window.addEventListener('resize',sizePv);sizePv();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(draw);
